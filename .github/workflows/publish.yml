name: Deploy Quarto Book

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies for R packages
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(
            c('knitr', 'rmarkdown', 'ggplot2', 'dplyr'),
            repos = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
            dependencies = TRUE
          )"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          pip install jupyter ipykernel matplotlib numpy pandas scipy
          python -m ipykernel install --user --name sms-python --display-name "SMS Python"

      - name: Install TinyTeX
        run: quarto install tinytex

      - name: Render Quarto Book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages-deploy
          shopt -s dotglob
          cp -r _book/* .
          rm -rf _book
          touch .nojekyll
          rm -f .gitignore
          git add -A
          git commit -m "Deploy Quarto book to GitHub Pages" --allow-empty
          git push origin gh-pages-deploy:gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}