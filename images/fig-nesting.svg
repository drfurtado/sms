<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <style>
      .box {
        fill: #f8f9fa;
        stroke: #2c3e50;
        stroke-width: 2;
        rx: 8;
      }
      .text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        fill: #2c3e50;
        text-anchor: middle;
      }
      .line {
        stroke: #2c3e50;
        stroke-width: 2;
        fill: none;
      }
    </style>
  </defs>
  
  <!-- Participant -->
  <rect class="box" x="150" y="10" width="100" height="40"/>
  <text class="text" x="200" y="35">Participant</text>
  
  <!-- Session -->
  <rect class="box" x="150" y="70" width="100" height="40"/>
  <text class="text" x="200" y="95">Session</text>
  
  <!-- Condition A -->
  <rect class="box" x="50" y="130" width="100" height="40"/>
  <text class="text" x="100" y="155">Condition A</text>
  
  <!-- Condition B -->
  <rect class="box" x="250" y="130" width="100" height="40"/>
  <text class="text" x="300" y="155">Condition B</text>
  
  <!-- Trials for Condition A -->
  <rect class="box" x="10" y="190" width="60" height="40"/>
  <text class="text" x="40" y="215">Trial 1</text>
  
  <rect class="box" x="80" y="190" width="60" height="40"/>
  <text class="text" x="110" y="215">Trial 2</text>
  
  <rect class="box" x="10" y="250" width="60" height="40"/>
  <text class="text" x="40" y="275">Trial 3</text>
  
  <!-- Trials for Condition B -->
  <rect class="box" x="210" y="190" width="60" height="40"/>
  <text class="text" x="240" y="215">Trial 1</text>
  
  <rect class="box" x="280" y="190" width="60" height="40"/>
  <text class="text" x="310" y="215">Trial 2</text>
  
  <rect class="box" x="330" y="250" width="60" height="40"/>
  <text class="text" x="360" y="275">Trial 3</text>
  
  <!-- Connecting lines -->
  <!-- Participant to Session -->
  <line class="line" x1="200" y1="50" x2="200" y2="70"/>
  
  <!-- Session to Conditions -->
  <line class="line" x1="200" y1="110" x2="200" y2="120"/>
  <line class="line" x1="100" y1="120" x2="300" y2="120"/>
  <line class="line" x1="100" y1="120" x2="100" y2="130"/>
  <line class="line" x1="300" y1="120" x2="300" y2="130"/>
  
  <!-- Condition A to Trials -->
  <line class="line" x1="100" y1="170" x2="100" y2="180"/>
  <line class="line" x1="40" y1="180" x2="110" y2="180"/>
  <line class="line" x1="40" y1="180" x2="40" y2="190"/>
  <line class="line" x1="110" y1="180" x2="110" y2="190"/>
  <line class="line" x1="40" y1="230" x2="40" y2="250"/>
  
  <!-- Condition B to Trials -->
  <line class="line" x1="300" y1="170" x2="300" y2="180"/>
  <line class="line" x1="240" y1="180" x2="360" y2="180"/>
  <line class="line" x1="240" y1="180" x2="240" y2="190"/>
  <line class="line" x1="310" y1="180" x2="310" y2="190"/>
  <line class="line" x1="360" y1="180" x2="360" y2="250"/>
</svg>
